name: Link Check

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "resources.json"
  workflow_dispatch: {}

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Excludes below the orb.edinburgh.gov.uk one are sites that
          # consistently 403 automated requests but work fine for real
          # visitors in a browser.
          args: >
            --no-progress
            --max-concurrency 8
            --timeout 20
            --retry-wait-time 5
            --user-agent "JGHS-Wellbeing-LinkCheck/1.0 (+https://www.jamesgillespies.co.uk)"
            --exclude "orb\.edinburgh\.gov\.uk"
            --exclude "breathingspace\.scot"
            --exclude "heldinourhearts\.org\.uk"
            --exclude "mind\.org\.uk"
            --exclude "moodjuice\.scot\.nhs\.uk"
            --exclude "nhs24\.scot"
            --exclude "nhsinform\.scot"
            resources.json
          fail: false
          format: markdown
